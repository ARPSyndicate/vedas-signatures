name: Signature request
description: Ask for Suricata and/or Nuclei coverage of a CVE.
title: "[REQUEST] CVE-YYYY-NNNNN"
labels: ["signature-request"]
body:
  - type: input
    id: cve
    attributes:
      label: CVE ID
      placeholder: CVE-2025-12345
    validations:
      required: true
  - type: checkboxes
    id: format
    attributes:
      label: Wanted coverage
      options:
        - label: Suricata rule (network detection)
        - label: Nuclei template (exposure check)
    validations:
      required: true
  - type: textarea
    id: refs
    attributes:
      label: References
      description: Advisory, public PoC, writeups, exploitation-in-the-wild reports.
    validations:
      required: true
  - type: checkboxes
    id: help
    attributes:
      label: Contribution
      options:
        - label: I am willing to submit a pull request for this
