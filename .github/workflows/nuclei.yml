name: Nuclei

on:
  pull_request:
    paths:
      - "nuclei/**"
      - "scripts/**"
      - ".github/workflows/nuclei.yml"
  push:
    branches: [main]
    paths:
      - "nuclei/**"
      - "scripts/**"
      - ".github/workflows/nuclei.yml"
  schedule:
    - cron: "37 3 * * 1" # weekly: re-validate the full corpus against the pinned Nuclei
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: nuclei-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  NUCLEI_VERSION: "3.11.1"

jobs:
  validate:
    name: Lint + engine check
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: scripts/requirements.txt

      - run: python3 -m pip install -r scripts/requirements.txt

      - name: Install Nuclei ${{ env.NUCLEI_VERSION }}
        run: |
          curl -sSfL -o nuclei.zip \
            "https://github.com/projectdiscovery/nuclei/releases/download/v${NUCLEI_VERSION}/nuclei_${NUCLEI_VERSION}_linux_amd64.zip"
          unzip -q -o nuclei.zip nuclei -d "$RUNNER_TEMP/bin"
          echo "$RUNNER_TEMP/bin" >> "$GITHUB_PATH"
          rm nuclei.zip

      - name: Scope
        id: scope
        run: |
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            echo "args=--base origin/${{ github.base_ref }}" >> "$GITHUB_OUTPUT"
          else
            echo "args=" >> "$GITHUB_OUTPUT"
          fi

      - name: Lint
        run: python3 scripts/lint_nuclei.py ${{ steps.scope.outputs.args }}

      - name: Engine check (nuclei -validate)
        if: ${{ !cancelled() }}
        run: python3 scripts/validate_nuclei_engine.py ${{ steps.scope.outputs.args }}
