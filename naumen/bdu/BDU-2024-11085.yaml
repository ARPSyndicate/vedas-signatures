id: BDU-2024-11085

info:
  name: "Naumen SMP - Stored XSS via crafted Excel (BDU:2024-11085)"
  author: vedas-arpsyndicate
  severity: medium
  description: |
    Stored XSS in Naumen Service Management Platform: insufficient input filtering and missing web-page structure protection allow a remote attacker to run script by uploading a crafted Excel document.
    This template extracts the Naumen marketing version and build number from the login-page
    buildInfo object and fires only when the exposed version satisfies compare_versions
    "<= 4.15.5.24". Instances that expose no version field are not flagged.
  reference:
    - https://www.exploit.observer/?keyword=BDU:2024-11085&match=exact
    - https://dbugs.ptsecurity.com/vulnerability/PT-2024-9393
    - https://bdu.fstec.ru/vul/2024-11085
    - https://subdomain.center/?engine=ammonites&keyword=naumen&match=exact
  classification:
    cwe-id: CWE-79
  metadata:
    verified: true
    bdu-id: BDU:2024-11085
    pt-id: PT-2024-9393
    affected: "Naumen Service Management Platform 4.15.5.24"
    version-gate: 'compare_versions(version, "<= 4.15.5.24")'
    product: naumen-smp
  tags: bdu,naumen,smp,xss

http:
  - method: GET
    path:
      - "{{BaseURL}}/sd/"
      - "{{BaseURL}}/"

    stop-at-first-match: true
    host-redirects: true
    max-redirects: 2

    matchers-condition: and
    matchers:
      - type: word
        part: body
        words:
          - "Naumen Service Desk"
          - "Naumen Service Management Platform"
          - "var buildInfo"
          - "/sd/js/login.js"
        condition: or

      - type: status
        status:
          - 200

      - type: dsl
        dsl:
          - 'compare_versions(ver_2024_11085, "<= 4.15.5.24")'

    extractors:
      - type: regex
        name: ver_2024_11085
        part: body
        internal: true
        group: 1
        regex:
          - '"version"\s*:\s*"([0-9][0-9.]+)"'

      - type: regex
        name: naumen_version
        part: body
        group: 1
        regex:
          - '"version"\s*:\s*"([0-9][0-9.]+)"'

      - type: regex
        name: build
        part: body
        group: 1
        regex:
          - '"buildNumber"\s*:\s*"([0-9]+)"'
          - '/sd/(?:js/login\.js|login\.css|themeSite\.css)\?v=([0-9]+)'
