id: BDU-2025-05680

info:
  name: "Naumen SMP - Remote Code Execution (BDU:2025-05680)"
  author: vedas-arpsyndicate
  severity: critical
  description: |
    Use of dangerous methods/functions in Naumen Service Management Platform allows a remote attacker to execute arbitrary code.
    This template extracts the Naumen marketing version and build number from the login-page
    buildInfo object and fires only when the exposed version satisfies compare_versions
    "< 4.19.5". Instances that expose no version field are not flagged.
  reference:
    - https://www.exploit.observer/?keyword=BDU:2025-05680&match=exact
    - https://dbugs.ptsecurity.com/vulnerability/PT-2024-41364
    - https://bdu.fstec.ru/vul/2025-05680
    - https://subdomain.center/?engine=ammonites&keyword=naumen&match=exact
  classification:
    cwe-id: CWE-94
  metadata:
    verified: true
    bdu-id: BDU:2025-05680
    pt-id: PT-2024-41364
    affected: "Naumen Service Management Platform < 4.19.5"
    version-gate: 'compare_versions(version, "< 4.19.5")'
    product: naumen-smp
  tags: bdu,naumen,smp,rce

http:
  - method: GET
    path:
      - "{{BaseURL}}/sd/"
      - "{{BaseURL}}/"

    stop-at-first-match: true
    host-redirects: true
    max-redirects: 2

    matchers-condition: and
    matchers:
      - type: word
        part: body
        words:
          - "Naumen Service Desk"
          - "Naumen Service Management Platform"
          - "var buildInfo"
          - "/sd/js/login.js"
        condition: or

      - type: status
        status:
          - 200

      - type: dsl
        dsl:
          - 'compare_versions(ver_2025_05680, "< 4.19.5")'

    extractors:
      - type: regex
        name: ver_2025_05680
        part: body
        internal: true
        group: 1
        regex:
          - '"version"\s*:\s*"([0-9][0-9.]+)"'

      - type: regex
        name: naumen_version
        part: body
        group: 1
        regex:
          - '"version"\s*:\s*"([0-9][0-9.]+)"'

      - type: regex
        name: build
        part: body
        group: 1
        regex:
          - '"buildNumber"\s*:\s*"([0-9]+)"'
          - '/sd/(?:js/login\.js|login\.css|themeSite\.css)\?v=([0-9]+)'
