id: BDU-2026-00670

info:
  name: "Naumen Service Desk - Unauth RCE (BDU:2026-00670)"
  author: vedas-arpsyndicate
  severity: critical
  description: |
    Insufficient input validation in Naumen Service Desk allows a remote attacker to execute arbitrary code. Affected version 4.17.5.13.baee52d7 (build 1056) and earlier.
    This template extracts the Naumen marketing version and build number from the login-page
    buildInfo object and fires only when the exposed version satisfies compare_versions
    "<= 4.17.5.13". Instances that expose no version field are not flagged.
  reference:
    - https://www.exploit.observer/?keyword=BDU:2026-00670&match=exact
    - https://bdu.fstec.ru/vul/2026-00670
    - https://subdomain.center/?engine=ammonites&keyword=naumen&match=exact
  classification:
    cwe-id: CWE-94
  metadata:
    verified: true
    bdu-id: BDU:2026-00670
    affected: "Naumen Service Desk 4.17.5.13.baee52d7 (build 1056)"
    version-gate: 'compare_versions(version, "<= 4.17.5.13")'
    product: naumen-service-desk
  tags: bdu,naumen,servicedesk,rce

http:
  - method: GET
    path:
      - "{{BaseURL}}/sd/"
      - "{{BaseURL}}/"

    stop-at-first-match: true
    host-redirects: true
    max-redirects: 2

    matchers-condition: and
    matchers:
      - type: word
        part: body
        words:
          - "Naumen Service Desk"
          - "Naumen Service Management Platform"
          - "var buildInfo"
          - "/sd/js/login.js"
        condition: or

      - type: status
        status:
          - 200

      - type: dsl
        dsl:
          - 'compare_versions(ver_2026_00670, "<= 4.17.5.13")'

    extractors:
      - type: regex
        name: ver_2026_00670
        part: body
        internal: true
        group: 1
        regex:
          - '"version"\s*:\s*"([0-9][0-9.]+)"'

      - type: regex
        name: naumen_version
        part: body
        group: 1
        regex:
          - '"version"\s*:\s*"([0-9][0-9.]+)"'

      - type: regex
        name: build
        part: body
        group: 1
        regex:
          - '"buildNumber"\s*:\s*"([0-9]+)"'
          - '/sd/(?:js/login\.js|login\.css|themeSite\.css)\?v=([0-9]+)'
