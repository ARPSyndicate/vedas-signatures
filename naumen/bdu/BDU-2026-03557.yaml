id: BDU-2026-03557

info:
  name: "Naumen SMP - Web Interface XSS (BDU:2026-03557)"
  author: vedas-arpsyndicate
  severity: medium
  description: |
    Reflected/stored XSS in the Naumen Service Management Platform web interface due to inadequate web-page structure protection.
    This template extracts the Naumen marketing version and build number from the login-page
    buildInfo object and fires only when the exposed version satisfies compare_versions
    "< 4.19". Instances that expose no version field are not flagged.
  reference:
    - https://www.exploit.observer/?keyword=BDU:2026-03557&match=exact
    - https://dbugs.ptsecurity.com/vulnerability/PT-2026-48796
    - https://bdu.fstec.ru/vul/2026-03557
    - https://subdomain.center/?engine=ammonites&keyword=naumen&match=exact
  classification:
    cwe-id: CWE-79
  metadata:
    verified: true
    bdu-id: BDU:2026-03557
    pt-id: PT-2026-48796
    affected: "Naumen Service Management Platform < 4.19"
    version-gate: 'compare_versions(version, "< 4.19")'
    product: naumen-smp
  tags: bdu,naumen,smp,xss

http:
  - method: GET
    path:
      - "{{BaseURL}}/sd/"
      - "{{BaseURL}}/"

    stop-at-first-match: true
    host-redirects: true
    max-redirects: 2

    matchers-condition: and
    matchers:
      - type: word
        part: body
        words:
          - "Naumen Service Desk"
          - "Naumen Service Management Platform"
          - "var buildInfo"
          - "/sd/js/login.js"
        condition: or

      - type: status
        status:
          - 200

      - type: dsl
        dsl:
          - 'compare_versions(ver_2026_03557, "< 4.19")'

    extractors:
      - type: regex
        name: ver_2026_03557
        part: body
        internal: true
        group: 1
        regex:
          - '"version"\s*:\s*"([0-9][0-9.]+)"'

      - type: regex
        name: naumen_version
        part: body
        group: 1
        regex:
          - '"version"\s*:\s*"([0-9][0-9.]+)"'

      - type: regex
        name: build
        part: body
        group: 1
        regex:
          - '"buildNumber"\s*:\s*"([0-9]+)"'
          - '/sd/(?:js/login\.js|login\.css|themeSite\.css)\?v=([0-9]+)'
