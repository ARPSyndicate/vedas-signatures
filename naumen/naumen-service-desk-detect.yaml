id: naumen-service-desk-detect

info:
  name: "Naumen Service Desk / SMP - Detection & Version"
  author: vedas-arpsyndicate
  severity: info
  description: |
    Fingerprints Naumen Service Desk / Service Management Platform (SMP) and extracts the
    deployed marketing version and build number. Naumen ships no public CVEs - advisories
    live only in Russia's BDU FSTEC database (e.g. BDU:2026-03557 / PT-2026-48796 SMP XSS) -
    so there is no off-the-shelf way to surface these hosts. Detection keys on the /sd/ web
    root, the "Naumen Service Desk" document title, the login-page buildInfo object and the
    versioned static assets. buildInfo exposes "version" (the 4.x marketing version, used by
    the per-BDU templates for compare_versions gating) and "buildNumber"; current 4.19-era
    builds drop the version field and expose only buildNumber (see this folder's README).
  reference:
    - https://subdomain.center/?engine=ammonites&keyword=naumen&match=exact
    - https://www.bdu.fstec.ru/vul/2026-03557
  metadata:
    verified: true
    shodan-favicon-hash: 453065545
    shodan-query: 'http.favicon.hash:453065545'
    fofa-query: 'title="Naumen Service Desk" || icon_hash="453065545"'
    product: naumen-service-desk
  tags: tech,naumen,panel,detect,servicedesk,smp

http:
  - method: GET
    path:
      - "{{BaseURL}}/sd/"
      - "{{BaseURL}}/"

    stop-at-first-match: true
    host-redirects: true
    max-redirects: 2

    matchers-condition: and
    matchers:
      - type: word
        part: body
        words:
          - "Naumen Service Desk"
          - "var buildInfo"
          - "/sd/js/login.js"
        condition: or

      - type: status
        status:
          - 200

    extractors:
      - type: regex
        name: version
        part: body
        group: 1
        regex:
          - '"version"\s*:\s*"([0-9][0-9.]+)"'

      - type: regex
        name: build
        part: body
        group: 1
        regex:
          - '"buildNumber":\s*"([0-9]+)"'
          - '/sd/(?:js/login\.js|login\.css|themeSite\.css)\?v=([0-9]+)'
